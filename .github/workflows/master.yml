name: Automated Commit
on:
  push:
    branches: [master] # Ensures the workflow triggers on pushes to master
  schedule:
    - cron: '0 */12 * * *' # Executes every 12 hours
  workflow_dispatch: # Allows manual triggering from the GitHub UI
permissions:
  contents: write # Grants permissions to write to the repo
jobs:
  update_commit:
    runs-on: ubuntu-latest # Specifies the runner
    steps:
      - name: Setup Debug Information
        run: echo "::debug::Triggered by ref = ${{github.ref}}"
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Git Configuration
        run: |
          git config user.email "gluyspt1221@gmail.com"
          git config user.name "Gluyspt"
      - name: Random Multi-Commit
        run: |
          commit_messages=("Update: ⏰" "Refresh: 🔄" "Renew: 🌟" "Revise: 📝" "Amend: 🛠" "Adjust: 🔧" "Change: 📈" "Modify: 🖊" "Transform: 🌀" "Revamp: 🌈")

          # Day-of-year mod 7 marks the "spike" day (roughly once a week)
          day_of_year=$(date '+%j')
          if [ $(( 10#$day_of_year % 7 )) -eq 0 ]; then
            echo "🔥 Spike day! Going big."
            commit_count=$(( (RANDOM % 16) + 15 ))  # 15–30 commits
          else
            commit_count=$(( (RANDOM % 5) + 1 ))    # 1–5 commits, normal day
          fi
          echo "Making $commit_count commit(s) this run"

          for i in $(seq 1 $commit_count); do
            current_time=$(date '+%Y-%m-%d %H:%M:%S')
            echo "Updated on $current_time (run $i/$commit_count)" > TIMESTAMP.txt
            random_msg=${commit_messages[$RANDOM % ${#commit_messages[@]}]}
            git add TIMESTAMP.txt
            git commit -m "$random_msg - $current_time" || echo "No changes to commit."
            sleep $(( (RANDOM % 3) + 1 ))
          done
      - name: GitHub Push
        uses: ad-m/github-push-action@v0.6.0
        with:
          directory: '.'
          github_token: ${{ secrets.GITHUB_TOKEN }}
